# Firebase App Hosting config — controls how this app builds and runs.
# Docs: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0       # scale to zero when idle (cheapest)
  maxInstances: 2

# Firebase WEB config (public client keys — safe as plain values, not secrets).
# Fill these per customer (the customize/ship skills set them) so the client SDK
# can reach the right Firebase project at build AND runtime.
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: ""
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: ""
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: ""
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: ""
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: ""
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: ""
    availability: [BUILD, RUNTIME]
